<!doctype html><html><body><h1>Workable application</h1><form>
<label for="full_name">Full name *</label><input id="full_name" name="full_name" required>
<label for="email">Email *</label><input id="email" name="email" type="email" required>
<label for="resume">Resume *</label><input id="resume" name="resume" type="file" required>
<fieldset><legend>Are you authorized to work in the United States? *</legend>
  <label><input type="radio" name="authorization" value="Yes" required>Yes</label>
  <label><input type="radio" name="authorization" value="No" required>No</label>
</fieldset>
<label for="waiver">I agree to binding arbitration and waive class action rights *</label>
<input id="waiver" type="checkbox" name="waiver" required>
<button type="submit">Submit application</button>
</form></body></html>
