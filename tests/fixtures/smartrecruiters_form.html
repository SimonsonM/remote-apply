<!doctype html><html><body><h1>SmartRecruiters application</h1><form>
<label for="full_name">Full name *</label><input id="full_name" name="full_name" required>
<label for="resume">Resume *</label><input id="resume" name="resume" type="file" required>
<label for="question">Why are you interested in this role? *</label><textarea id="question" name="question" required></textarea>
<label for="consent">I consent to the candidate privacy notice *</label>
<input id="consent" type="checkbox" name="consent" required>
<button type="submit">Submit application</button>
</form></body></html>
